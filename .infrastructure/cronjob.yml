apiVersion: batch/v1
kind: CronJob
metadata:
  name: health-cronjob
  namespace: mateapp
spec:
  schedule: "*/4 * * * *"
  concurrencyPolicy: Allow
  startingDeadlineSeconds: 100
  successfulJobsHistoryLimit: 10
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      template:
        spec:
          containers:
          - name: health
            image: ikulyk404/busyboxplus:curl
            command:
            - /bin/sh
            - -c
            - date; curl http://todoapp.mateapp.svc.cluster.local/api/health
          restartPolicy: OnFailure